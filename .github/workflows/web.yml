name: web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # The content layer validates every committed run against the §10
      # contract at build time, so a malformed run breaks the build rather
      # than rendering as a partial result.
      # `npm run build` runs the CSP hashing and the nesting guard. The guard
      # fails the build on flow content inside a <p>, which is what caused the
      # hydration mismatch that discarded and re-rendered every page.
      - run: npm run build
